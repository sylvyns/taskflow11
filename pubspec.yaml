name: taskflow
description: "TaskFlow — управление проектами и задачами. СРС 11: Clean Architecture."
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Локальная база данных (Local DataSource)
  drift: ^2.22.0
  drift_flutter: ^0.2.1

  # Сеть (Remote DataSource)
  dio: ^5.7.0

  # State management
  flutter_bloc: ^8.1.6

  # Dependency Injection
  get_it: ^8.0.2

  # Either<Failure, T>
  dartz: ^0.10.1

  # Избранное (новая функция) — локальное сохранение
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.22.0
  build_runner: ^2.4.13
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
